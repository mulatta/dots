[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "addgene-mcp"
version = "0.1.0"
description = "Read-only Addgene Developers API MCP server"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["mcp", "httpx", "pydantic"]

[project.scripts]
addgene-mcp = "addgene_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["addgene_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
