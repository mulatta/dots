version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    open-pull-requests-limit: 50
    labels:
      - "dependencies"
      - "auto-merge"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/home/.pi/agent"
    schedule:
      interval: "weekly"
