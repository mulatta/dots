version: 2
updates:
  # The force-pushed nixpkgs fork and the package locks under packages/* are
  # bumped by hand and by .#updater, not here.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/home/.pi/agent"
    schedule:
      interval: "weekly"
